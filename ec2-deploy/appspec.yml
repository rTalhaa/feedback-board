# CodeDeploy in-place revision for the EC2 Auto Scaling group.
# Jenkins copies app/app.py and app/requirements.txt in here before `aws deploy push`.
version: 0.0
os: linux
files:
  - source: /
    destination: /opt/feedback
file_exists_behavior: OVERWRITE
hooks:
  ApplicationStop:
    - { location: scripts/stop.sh, timeout: 60, runas: root }
  AfterInstall:
    - { location: scripts/install.sh, timeout: 600, runas: root }
  ApplicationStart:
    - { location: scripts/start.sh, timeout: 60, runas: root }
  ValidateService:
    - { location: scripts/validate.sh, timeout: 120, runas: root }
