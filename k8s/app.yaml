# Same dashboard image as ECS, on Kubernetes. ${IMAGE} is filled in by scripts/deploy.sh eks.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: feedback-dashboard
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: feedback-dashboard
  labels: { app: feedback-dashboard }
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app: feedback-dashboard }
  template:
    metadata:
      labels: { app: feedback-dashboard }
    spec:
      serviceAccountName: feedback-dashboard
      containers:
        - name: dashboard
          image: ${IMAGE}
          ports: [{ containerPort: 8080 }]
          env:
            - { name: TABLE_NAME, value: feedback-prod }
            - { name: AWS_DEFAULT_REGION, value: ap-south-1 }
            - { name: APP_VERSION, value: eks }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 250m, memory: 256Mi }
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: feedback-dashboard
spec:
  type: LoadBalancer
  selector: { app: feedback-dashboard }
  ports: [{ port: 80, targetPort: 8080 }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: feedback-dashboard
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: feedback-dashboard }
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 60 } }
